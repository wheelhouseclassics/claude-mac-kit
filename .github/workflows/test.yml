name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gitleaks
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install gitleaks; else
            curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks; fi
          gitleaks version
      - name: Install shellcheck (install.sh gate)
        run: |
          if ! command -v shellcheck >/dev/null; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install shellcheck; else sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; fi
          fi
          shellcheck --version | head -2
      - name: Install markitdown (auto-md hook test)
        run: python3 -m pip install --user --break-system-packages 'markitdown[all]' || python3 -m pip install --user 'markitdown[all]' || true
      - run: node --test "test/*.test.js"
